name: Build SUB-MIDI vox

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dsp-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: DSP test (без JUCE)
        run: |
          cmake -S . -B build-test -DCMAKE_BUILD_TYPE=Release -DPEPEL_BUILD_TOOLS=ON -DPEPEL_BUILD_PLUGIN=OFF -DPEPEL_ONLY_DSP_TEST=ON
          cmake --build build-test --target PepelDspTest --parallel
          ./build-test/PepelDspTest

  build:
    needs: dsp-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS,   os: macos-latest }
          - { name: Linux,   os: ubuntu-22.04 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Configure (macOS, arm64 + x86_64)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp -R build/PepelVox_artefacts/Release/* dist/
          cp README.md dist/ || true
          cp Assets/OFL-*.txt dist/
          cd dist && cmake -E tar cf "../SUB-MIDI-vox-${{ matrix.name }}.zip" --format=zip .

      - uses: actions/upload-artifact@v4
        with:
          name: SUB-MIDI-vox-${{ matrix.name }}
          path: SUB-MIDI-vox-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
